name: CI/CD Docker Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./python-helloworld
          file: ./python-helloworld/Dockerfile
          push: true
          tags: dimakadocker/python-helloworld:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Update image tag in deployment.yaml
        uses: datamonsters/replace-action@v2
        with:
          files: 'exercises/manifests/deployment.yaml'
          placeholder: 'tag:latest'
          replacement: '${{ github.sha }}'