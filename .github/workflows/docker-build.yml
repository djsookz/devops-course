
name: CI/CD Docker Build

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./python-helloworld
          file: ./python-helloworld/Dockerfile
          push: true
          tags: dimakadocker/python-helloworld:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Update image tag in deployment.yaml
        uses: datamonsters/replace-action@v2
        with:
          files: exercises/manifests/deployment.yaml
          replacements: '$IMAGE=dimakadocker/python-helloworld:${{ github.sha }}'

      - name: Commit and push deployment.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercises/manifests/deployment.yaml
          git commit -m "Update Docker image to ${{ github.sha }}" || exit 0
          git push
