apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx
    tag: alpine
  name: nginx-alpine
  namespace: demo
spec:
  ports:
  - port: 8111
    protocol: TCP
    targetPort: 5000 # ВАЖНО: Ако Python апп-ът ти слуша на 5000, смени това на 5000!
  selector:
    app: nginx
    tag: alpine
  type: NodePort # Променено от ClusterIP на NodePort